version: "3.9"
services:
  chronicle:
    image: patchtrail/chronicle:latest
    container_name: chronicle
    restart: unless-stopped
    ports:
      - "3791:3000"
    volumes:
      - /media/projects2/chronicle/data:/app/data
    environment:
      - NODE_ENV=production
      - DB_PATH=/app/data/chronicle.db
